<script>
const REPORT = JSON.parse(document.getElementById('report-data').textContent);
const root = document.getElementById('root');

const sleeveColors = {
  'BIG Fund': '#D4AF37', 'Equity': '#64B5F6', 'Fixed Income': '#81C784',
  'Alternatives': '#FFA726', 'Multi-Asset': '#BA68C8', 'Cash': '#CE93D8',
};
const sleeveClass = s => s.replace(/[^a-zA-Z]/g, '');
const fmtMoney = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };

// ---------- Title + freshness ----------
function renderHeader() {
  const m = REPORT.meta;
  root.appendChild(el(`<div class="title-block">
    <h1>${m.title}</h1>
    <div class="sub">${m.subtitle}</div>
    <div class="accounts">${m.accounts_line}</div>
  </div>`));
  const fresh = (m.freshness || []).map(f => `<b>${f.label}</b> ${f.text}`).join(' &nbsp;·&nbsp; ');
  const tail = m.freshness_tail ? ' &nbsp;·&nbsp; ' + m.freshness_tail : '';
  if (fresh || tail) root.appendChild(el(`<div class="freshness-banner">${fresh}${tail}</div>`));
}

// ---------- Correction flag ----------
function renderCorrections() {
  if (!REPORT.corrections || !REPORT.corrections.length) return;
  const bullets = REPORT.corrections.map(c => `<br>• ${c.html}`).join('');
  const intro = REPORT.correction_intro || '';
  const outro = REPORT.correction_outro ? `<br>${REPORT.correction_outro}` : '';
  root.appendChild(el(`<div class="correction-flag">🔍 <b>Corrección de clasificación (post cruce con Maximus):</b> ${intro}${bullets}${outro}</div>`));
}

// ---------- KPI grid ----------
function renderKpis() {
  const grid = el('<div class="kpi-grid"></div>');
  REPORT.kpis.forEach(k => {
    const style = k.gold ? ' style="border-left-color: var(--big);"' : '';
    grid.appendChild(el(`<div class="kpi-card"${style}>
      <div class="label">${k.label}</div>
      <div class="value">${k.value}</div>
      <div class="sub">${k.sub || ''}</div>
    </div>`));
  });
  root.appendChild(grid);
}

// ---------- helpers: sleeve bars ----------
function sleeveBars(rows) {
  // rows: [label, pct, color]
  return rows.map(([label, pct, color]) => `
    <div class="sleeve-bar-row">
      <div class="sleeve-bar-label" style="color:${color};">${label}</div>
      <div class="sleeve-bar-track"><div class="sleeve-bar-fill" style="width:${Math.max(Math.abs(pct),0)}%; background:${color};"></div></div>
      <div class="sleeve-bar-pct">${pct}%</div>
    </div>`).join('');
}

// ---------- Asset allocation (Pershing wrapper view) ----------
function renderWrapperAlloc() {
  const holdings = REPORT.holdings;
  const total = holdings.reduce((s, h) => s + h.mv, 0);
  const bySleeve = {};
  holdings.forEach(h => { bySleeve[h.sleeve] = (bySleeve[h.sleeve] || 0) + h.mv; });
  const order = REPORT.sleeve_order || ['BIG Fund', 'Equity', 'Multi-Asset', 'Fixed Income', 'Alternatives', 'Cash'];
  const labels = order.filter(s => bySleeve[s] !== undefined);
  const barRows = labels.map(s => [s === 'BIG Fund' ? '🏛️ BIG Fund' : s, +(bySleeve[s] / total * 100).toFixed(1), sleeveColors[s] || '#888']);

  const sec = el(`<div class="section">
    <h2>🥧 Asset Allocation — Posiciones Pershing (${REPORT.meta.as_of_short || ''}, corregida)</h2>
    <div class="two-col">
      <div id="pie-chart" style="height: 420px;"></div>
      <div style="display:flex; flex-direction:column; justify-content:center;">
        ${sleeveBars(barRows)}
        <div class="note">${REPORT.wrapper_alloc_note || ''}</div>
      </div>
    </div>
  </div>`);
  root.appendChild(sec);

  const pv = labels.map(s => bySleeve[s]);
  const pc = labels.map(s => sleeveColors[s] || '#888');
  Plotly.newPlot('pie-chart', [{
    type: 'pie', hole: 0.45, labels, values: pv,
    marker: { colors: pc, line: { color: '#0D1B2A', width: 2 } },
    textinfo: 'label+percent', textposition: 'outside',
    textfont: { size: 12, color: '#E0E8F0' },
    hovertemplate: '<b>%{label}</b><br>$%{value:,.0f}<br>%{percent}<extra></extra>',
  }], {
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', showlegend: false,
    margin: { t: 30, b: 30, l: 60, r: 60 },
    annotations: [{ text: `<b>Total</b><br>$${(total / 1e6).toFixed(2)}M<br>100%`, showarrow: false, font: { color: '#D4AF37', size: 13 }, x: 0.5, y: 0.5 }],
    font: { color: '#E0E8F0' },

}

// ---------- Holdings table ----------
function renderHoldingsTable() {
  const holdings = REPORT.holdings;
  const total = holdings.reduce((s, h) => s + h.mv, 0);
  const sec = el(`<div class="section">
    <h2>📋 Holdings Consolidados (por Sleeve)</h2>
    <table><thead><tr>
      <th>Posición</th><th>Sub-Categoría</th><th class="num">Cuenta(s)</th>
      <th class="num">Market Value</th><th class="num">% del Total</th>
    </tr></thead><tbody id="holdings-tbody"></tbody></table>
  </div>`);
  root.appendChild(sec);
  const tb = sec.querySelector('#holdings-tbody');
  [...holdings].sort((a, b) => b.mv - a.mv).forEach(h => {
    const pct = (h.mv / total * 100).toFixed(1);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="sleeve-tag ${sleeveClass(h.sleeve)}"><b>${h.name}</b><br><span style="font-size:10px;color:#6B88A8;">${h.sleeve}</span></td>
      <td style="color:#90CAF9; font-size:11.5px;">${h.bucket}</td>
      <td class="num" style="font-size:11px; color:#6B88A8;">${h.accounts.join(' + ')}</td>
      <td class="num">${fmtMoney(h.mv)}</td>
      <td class="num" style="font-weight:bold; color:${h.mv < 0 ? '#EF5350' : '#E0E8F0'};">${pct}%</td>`;
    tb.appendChild(tr);
  });
}

// ---------- Performance ----------
function renderPerformance() {
  const p = REPORT.performance;
  if (!p) return;
  const cols = p.columns.map(c => `<th>${c}</th>`).join('');
  const rowHtml = r => {
    const cells = r.cells.map(c => `<td>${c}</td>`).join('');
    if (r.type === 'consolidado') return `<tr class="row-consolidado"><td>${r.name}</td>${cells}</tr>`;
    if (r.type === 'benchmark') return `<tr style="background:#1a1a1a; color:#90A4AE;"><td>${r.name}</td>${cells}</tr>`;
    return `<tr><td>${r.name}</td>${cells}</tr>`;
  };
  const statBlock = s => s ? `<div><h3>${s.title}</h3>${s.rows.map(([k, v, color]) => `<div class="stat-row"><span class="k">${k}</span><span class="v"${color ? ` style="color:${color};"` : ''}>${v}</span></div>`).join('')}${s.note ? `<div style="font-size:10px; color:var(--text-ter); margin-top:6px;">${s.note}</div>` : ''}</div>` : '<div></div>';
  const sec = el(`<div class="section">
    <h2>📈 Performance (${p.source_label})</h2>
    <table class="perf-table"><thead><tr><th>Cuenta</th>${cols}</tr></thead>
      <tbody>${p.rows.map(rowHtml).join('')}</tbody></table>
    <div class="note">${p.footnotes_html || ''}</div>
    <div class="three-col" style="margin-top:18px;">
      ${statBlock(p.risk_stats)}${statBlock(p.fi_stats)}${statBlock(p.rv_stats)}
    </div>
  </div>`);
  root.appendChild(sec);
}

// ---------- mini bars ----------
function renderMiniBars(container, data) {
  const maxAbs = Math.max(...data.map(d => Math.abs(d[1])), 1);
  [...data].sort((a, b) => b[1] - a[1]).forEach(([label, val]) => {
    const pct = Math.min(Math.abs(val) / maxAbs * 100, 100);
    container.appendChild(el(`<div class="mini-bar-row">
      <div class="mini-bar-label">${label}</div>
      <div class="mini-bar-track"><div class="mini-bar-fill ${val < 0 ? 'neg' : ''}" style="width:${pct}%;"></div></div>
      <div class="mini-bar-pct">${val.toFixed(1)}%</div>
    </div>`));
  });
}

// ---------- Top holdings look-through ----------
function renderTopHoldings() {
  const t = REPORT.top_holdings;
  if (!t) return;
  const total = REPORT.holdings.reduce((s, h) => s + h.mv, 0);
  const sources = [];
  (t.direct || []).forEach(([name, amt]) => sources.push([name, amt, 'Directo 100%']));
  (t.funds || []).forEach(f => (f.holdings || []).forEach(([name, w]) => sources.push([name, f.dollars * w / 100, `${f.via} ${w}%`])));
  const agg = {};
  sources.forEach(([name, amt, via]) => { if (!agg[name]) agg[name] = { amt: 0, vias: [] }; agg[name].amt += amt; agg[name].vias.push(via); });
  const ranked = Object.entries(agg).sort((a, b) => b[1].amt - a[1].amt).slice(0, t.top_n || 15);
  const maxAmt = ranked[0][1].amt;
  const acwi = t.acwi_weights || {};

  const sec = el(`<div class="section">
    <h2>🎯 Top Holdings Consolidado (look-through single-stock)</h2>
    <div style="font-size:11px; color:var(--text-ter); text-align:center; margin-bottom:14px;">${t.note_html || ''}</div>
    <table><thead><tr><th>#</th><th>Holding</th><th>Vía (fondo · peso)</th><th class="num">% del Total</th><th class="num">% ACWI</th><th class="num">Over/Under</th><th>Bar</th></tr></thead>
      <tbody id="top-holdings-tbody"></tbody></table>
    <div style="font-size:10px; color:var(--text-ter); margin-top:10px; line-height:1.6;">${t.footnote_html || ''}</div>
  </div>`);
  root.appendChild(sec);
  const tb = sec.querySelector('#top-holdings-tbody');
  ranked.forEach(([name, d], i) => {
    const pct = d.amt / total * 100;
    const barPct = (d.amt / maxAmt * 100).toFixed(0);
    const w = acwi[name];
    const acwiCell = w !== undefined ? `${w.toFixed(2)}%` : '&lt;0.05%*';
    const delta = w !== undefined ? (pct - w) : null;
    const deltaCell = delta !== null
      ? `<span style="color:${delta >= 0 ? '#81C784' : '#EF5350'};font-weight:bold;">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}pp</span>`
      : `<span style="color:#81C784;font-weight:bold;">+${pct.toFixed(2)}pp*</span>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td><td><b>${name}</b></td>
      <td style="color:#90CAF9; font-size:11px;">${d.vias.join(' + ')}</td>
      <td class="num" style="font-weight:bold;">${pct.toFixed(2)}%</td>
      <td class="num" style="color:#90A4AE;">${acwiCell}</td>
      <td class="num">${deltaCell}</td>
      <td><div class="mini-bar-track" style="max-width:140px;"><div class="mini-bar-fill" style="width:${barPct}%;"></div></div></td>`;
    tb.appendChild(tr);
  });
}

// ---------- RF / RV breakdowns ----------
function renderThreeColBars(title, note, blocks) {
  // blocks: [ [h3, data], ... ]
  const sec = el(`<div class="section"><h2>${title}</h2>${note ? `<div style="font-size:11px; color:var(--text-ter); text-align:center; margin-bottom:14px;">${note}</div>` : ''}<div class="three-col"></div></div>`);
  const cont = sec.querySelector('.three-col');
  const ids = [];
  blocks.forEach(([h3], i) => { ids.push('tc-' + Math.random().toString(36).slice(2)); cont.appendChild(el(`<div><h3>${h3}</h3><div id="${ids[i]}"></div></div>`)); });
  root.appendChild(sec);
  blocks.forEach(([, data], i) => renderMiniBars(sec.querySelector('#' + ids[i]), data));
}
