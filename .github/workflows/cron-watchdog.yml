name: 🐕 Watchdog — ¿corrió el refresh de hoy?

# Por que existe (2026-08-28)
# --------------------------
# record_run_status.py escribe la alerta DENTRO de la corrida. Si un paso falla,
# queda el aviso. Pero si GitHub nunca dispara el workflow, no hay nada que
# escriba nada: silencio total. Es una alarma de incendio que solo suena si
# alguien la enciende.
#
# Paso dos veces la misma semana:
#   27-ago  agendado 12:30 UTC, arranco 22:30 UTC (10 horas tarde)
#   28-ago  no arranco nunca -- Lucas lo tuvo que disparar a mano
#
# En los dos casos Lucas se entero abriendo el dashboard y viendo data vieja.
#
# Este watchdog corre mas tarde y pregunta, via scripts/should_run_refresh.py:
# ¿corrio el refresh de hoy Y con data fresca? Si no, dispara el workflow
# principal y avisa por mail. No reemplaza al cron original -- son dos
# oportunidades independientes en vez de una.
#
# ACTUALIZADO 2026-09-01: antes solo miraba si last_run.json tenia la fecha de
# hoy. No alcanzaba: con varios disparadores, el primero puede caer ANTES de que
# Lynk publique el NAV, marcar el dia como hecho y bloquear los reintentos --
# dejando data vieja todo el dia. Ahora el dia cuenta como hecho solo si ademas
# el NAV llego fresco. La logica esta en el script, compartida con el guard del
# propio daily-refresh para no tener dos copias.
#
# Limite honesto: esto tambien es un schedule de GitHub y tambien se puede
# retrasar. No es garantia absoluta, es una segunda red.

on:
  schedule:
    # 16:07 UTC = 13:07 ART. Cuatro horas despues del refresh principal, con
    # margen de sobra para el retraso tipico (~1h) de GitHub. Minuto 07 a
    # proposito: GitHub congestiona mas los horarios redondos (:00 y :30).
    - cron: '7 16 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Corrió el refresh de hoy Y con data fresca?
        id: check
        run: |
          R=$(python scripts/should_run_refresh.py)
          if [ "$R" = "si" ]; then
            echo "corrio=no" >> $GITHUB_OUTPUT
          else
            echo "corrio=si" >> $GITHUB_OUTPUT
          fi

      - name: Disparar el refresh que falto
        if: steps.check.outputs.corrio == 'no'
        run: |
          gh workflow run daily-refresh.yml --ref main
          echo "daily-refresh.yml disparado por el watchdog."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dejar alerta + avisar por mail
        if: steps.check.outputs.corrio == 'no'
        run: |
          mkdir -p data/_alerts
          HOY=$(date -u +%Y-%m-%d)
          python - <<'PY'
          import json, os, datetime
          hoy = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          alerta = {
              "detected_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "date": hoy,
              "tipo": "cron_no_corrio",
              "issues": [
                  f"El daily-refresh de {hoy} no habia corrido a las 16:07 UTC "
                  f"(agendado 12:30 UTC). El watchdog lo disparo. Si esto se "
                  f"repite seguido, GitHub esta postergando los schedules y "
                  f"conviene revisar el horario."
              ],
          }
          with open(f"data/_alerts/cron_no_corrio_{hoy}.json", "w", encoding="utf-8") as f:
              json.dump(alerta, f, indent=2, ensure_ascii=False)
          print("alerta escrita")
          PY
          python scripts/send_failure_alert.py || echo "mail fallo, la alerta igual quedo en data/_alerts/"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_LUCAS: ${{ secrets.MAIL_LUCAS }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commitear la alerta
        if: steps.check.outputs.corrio == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_alerts/ || true
          git diff --staged --quiet || git commit -m "chore(alerts): el watchdog disparo el refresh que falto"
          git pull --rebase origin main || true
          git push origin main || true
