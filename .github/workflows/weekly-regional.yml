name: Weekly Regional Equity (estimacion)

# Estimacion semanal del regional del Equity sleeve (widget Regional + cuadro "BIG vs Modelo
# Mikla Core Equities vs ACWI"). Parte del regional OFICIAL de Maximus (cierre de mes, carga
# manual) y le aplica los movimientos de cartera desde entonces. Ver scripts/regional_rollforward.py.
#
# Corre los LUNES a las 17:00 UTC (14:00 ART): despues del refresh diario (12:30 UTC, que GitHub
# suele atrasar) y del watchdog (16:07 UTC), asi toma el canonical del dia.
# Salida: data/regional_estimado.json. Si falla, el front sigue mostrando el dato anterior/oficial.

on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regional estimado (roll-forward desde Maximus)
        run: python scripts/regional_rollforward.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regional_estimado.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "chore(regional): estimacion semanal ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
