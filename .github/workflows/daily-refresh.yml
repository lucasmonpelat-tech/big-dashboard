name: 🔄 Daily Refresh BIG (Lynk + Sleeves + Alertas + Digest)

# Routine unificada de actualizacion del dashboard de BIG.
# Corre los Lunes a Sabado a las 8 AM ART (= 11 UTC).
# Reemplaza los workflows viejos:
#   - lynk-daily-refresh.yml
#   - equity-daily-refresh.yml
#
# Que hace:
#   1. Health-check (solo lunes): verifica que la corrida del sabado anterior haya
#      terminado OK. Si no, deja un warning marker.
#   2. Scrapea Lynk (NAV / YTD / SI / AUM / Vol / Sharpe) — KPIs principales.
#   3. Sync NAVs de equity UCITS desde Pershing/NetX360 (ex-baha, ver 2026-07-28).
#   4. Stooq prices (ETFs liquidos).
#   5. Yahoo bench indices (ACWI, AGG, SOFR para Normalized Performance).
#   6. Recompute Equity sleeve daily NAV + Equity Race (buy-and-hold vs ACWI).
#   7. Recompute FI sleeve daily NAV + FI Race (per-fondo T-1 con anclas baha).
#   8. Recompute Alts Race (liquidos: IBIT, GLD).
#   9. Brinson Attribution YTD.
#   10. Commit + push (data/) — los charts del dashboard se actualizan solos.
#   11. Record run status (success/failure marker en data/_alerts/).
#   12. Alerta inmediata por mail (todos los dias) si hubo alguna alerta hoy.
#   13. Weekly digest (solo sabados, ACTUALMENTE DESACTIVADO -- ver weekly_digest.py).
#
# Alertas:
#   - Si algo falla, queda marker en data/_alerts/cron_failure_YYYY-MM-DD.json
#     (y otros scripts dejan sus propios markers: sleeve_return_anomaly_*,
#     health_check_warning_*, bench_indices_stale_*, netx360_download_*, etc.)
#   - send_failure_alert.py manda mail a Lucas + Fer EL MISMO DIA si aparece
#     cualquiera de esos markers (2026-07-31, agregado porque Lucas se va de
#     vacaciones y varios steps tienen continue-on-error: true -- el job puede
#     terminar "success" aunque algo se haya roto en silencio).
#   - Ademas, Claude lo detecta al inicio de sesion (regla en MEMORY.md) y avisa.

on:
  schedule:
    # 11:00 UTC = 08:00 ART, Lunes a Sabado (1-6 en cron weekday).
    - cron: '0 11 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LYNK_EMAIL: ${{ secrets.LYNK_EMAIL || 'lucas.monpelat@pampa-capital.com' }}
      BAHA_EMAIL: ${{ secrets.BAHA_EMAIL }}
      BAHA_PASSWORD: ${{ secrets.BAHA_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_LUCAS: ${{ secrets.MAIL_LUCAS }}
      MAIL_FER: ${{ secrets.MAIL_FER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # === Pipeline v2 (NetX360+ Pershing → canonical JSONs) ===
      NETX360_USER: ${{ secrets.NETX360_USER }}
      NETX360_PASSWORD: ${{ secrets.NETX360_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Detect day of week (set outputs)
        id: dow
        run: |
          DOW=$(date -u +%u)  # 1=Mon ... 6=Sat ... 7=Sun
          echo "dow=$DOW" >> $GITHUB_OUTPUT
          if [ "$DOW" = "1" ]; then echo "is_monday=true"   >> $GITHUB_OUTPUT; else echo "is_monday=false"   >> $GITHUB_OUTPUT; fi
          if [ "$DOW" = "6" ]; then echo "is_saturday=true" >> $GITHUB_OUTPUT; else echo "is_saturday=false" >> $GITHUB_OUTPUT; fi
          echo "Hoy es $(date -u +%A), dow=$DOW"

      # === HEALTH CHECK (solo lunes) ===
      - name: Health-check Saturday's run (Mondays only)
        if: steps.dow.outputs.is_monday == 'true'
        run: python scripts/check_previous_run.py --expected-day saturday
        continue-on-error: true

      # === SCRAPING ===
      - name: Lynk NAV scrape (KPIs)
        run: python scripts/lynk_refresher.py --email "$LYNK_EMAIL"

      - name: Lynk NAV series (full history)
        run: python scripts/lynk_nav_extractor.py --email "$LYNK_EMAIL"
        continue-on-error: true

      - name: Baha NAV refresher (Equity + FI UCITS) — best-effort, ver sync Pershing abajo
        run: python scripts/baha_nav_refresher.py
        continue-on-error: true

      - name: Sync UCITS NAV desde Pershing/NetX360 (reemplaza baha, ver 2026-07-28)
        run: python scripts/sync_ucits_nav_from_pershing.py
        continue-on-error: true

      - name: Stooq prices (ETFs liquidos)
        run: python scripts/price_refresher.py
        continue-on-error: true

      - name: Bench indices Equity (ACWI / S&P / Nasdaq / MSCI World)
        run: python scripts/bench_indices_refresher.py
        continue-on-error: true

      - name: Bench indices FI (AGG / SOFR / UST)
        run: python scripts/fi_bench_indices_refresher.py
        continue-on-error: true

      - name: Bench 60/40 (AOR ETF)
        run: python scripts/bmk_refresher.py
        continue-on-error: true

      # === PIPELINE V2 (NetX360+ Pershing → canonical JSONs) ===
      # Movido mas temprano (antes: despues de Brinson Attribution) para que
      # compute_holdings_returns.py y refresh_holdings_returns_daily.py usen
      # el mismo download del dia (qty/cost basis 100% al dia, ver nota abajo).
      - name: v2 — NetX360+ Pershing download (4 XLSX)
        run: python dashboard_v2/ingest/netx360_auto.py
        continue-on-error: true

      # Reconstruye qty/cost_basis/buys_history desde el UGL+RGL+Transactions
      # de HOY (merge incremental -- ver docstring de merge_buys_history en el
      # script, seguro para correr todos los dias sin perder historial viejo).
      # Fix 2026-07-28: sin este paso, holdings_returns_{sleeve}.json solo se
      # actualizaba corriendo el script a mano, y quedaba con qty vieja
      # (ej: IBIT/GLD/PIMCO-LD/MANIG/SGCB con compras recientes sin capturar).
      - name: Reconcile qty/cost basis con Pershing (compute_holdings_returns, merge-safe)
        run: |
          RAW_DIR="data/raw/$(date -u +%Y-%m-%d)/netx360"
          if [ -f "$RAW_DIR/Unrealized+Gain+Loss_JXD101380.xlsx" ]; then
            python scripts/compute_holdings_returns.py \
              --ugl "$RAW_DIR/Unrealized+Gain+Loss_JXD101380.xlsx" \
              --rgl "$RAW_DIR/Realized+Gain+Loss_JXD101380.xlsx" \
              --tx  "$RAW_DIR/Transactions_JXD101380.xlsx"
          else
            echo "No se descargaron los XLSX de NetX360 hoy -- se omite (holdings_returns_*.json queda con la ultima qty conocida)."
          fi
        continue-on-error: true

      # Sync qty/price/value en positions_latest.json desde el canonical fresco.
      # Fix 2026-07-28: este archivo legacy alimenta el "override" del ultimo
      # punto en refresh_equity_daily.py / refresh_fi_daily.py / refresh_alts_daily.py
      # -- quedo congelado en 2026-06-24 (nadie lo subia a mano), causando que
      # equity_sleeve_real.json / fi_sleeve_real.json (que alimentan el "Sleeve
      # SI/YTD" del dashboard) usaran qty vieja para PIMCO-LD/MANIG/SGCB, y ni
      # siquiera incluyeran MAGS/HEWJ (compras del 2026-07-02).
      - name: Sync positions_latest.json desde canonical (Pershing)
        run: python scripts/sync_positions_latest_from_canonical.py
        continue-on-error: true

      # === RECOMPUTE ===
      - name: Recalc Equity sleeve daily NAV
        run: python scripts/refresh_equity_daily.py

      - name: Recalc Equity race daily (buy-and-hold vs ACWI)
        run: python scripts/refresh_equity_race_daily.py
        continue-on-error: true

      - name: Recalc FI sleeve daily NAV
        run: python scripts/refresh_fi_daily.py

      - name: Recalc FI race daily (per-fondo T-1 anclas baha)
        run: python scripts/refresh_fi_race_daily.py
        continue-on-error: true

      - name: Recalc Alts race daily (liquidos)
        run: python scripts/refresh_alts_daily.py
        continue-on-error: true

      - name: Refresh holdings returns T-1 (cost basis methodology)
        run: python scripts/refresh_holdings_returns_daily.py
        continue-on-error: true

      # Cross-check del Sleeve SI/YTD (equity_sleeve_real.json / fi_sleeve_real.json)
      # contra el metodo independiente cost-basis ponderado. Fix 2026-07-30: un bug
      # de anchor Modified Dietz dio un FI YTD -1.09% ficticio durante dias sin que
      # nadie lo notara (Fer lo vio antes que Lucas) -- este paso escribe una alerta
      # en data/_alerts/ si algo similar vuelve a pasar, para que se detecte ANTES
      # de llegar a produccion sin avisar. Ver memoria bug_twr_anchor_gap_modified_dietz.
      - name: Validar Sleeve SI/YTD (cross-check anti anchor-drift)
        run: python scripts/validate_sleeve_returns.py
        continue-on-error: true

      # Extiende el TWR real de Alts (data/alts_sleeve_real.json, reconstruccion
      # completa 2026-07-31 desde statements Pershing + Carlyle) con el punto de
      # hoy, y propaga sleeve_index/sleeve_monthly_returns a alts_race.json --
      # ese archivo ya NO se reconstruye con proxies en cada corrida (alts_race.py
      # no esta en el cron), asi que sin este paso quedaria congelado.
      # Debe correr ANTES de sync_alts_ugl.py (que calcula stats 1M/3M/6M/YTD/SI
      # leyendo sleeve_index).
      - name: Extender Alts sleeve TWR real (jun-30 anchor Pershing+Carlyle)
        run: python scripts/refresh_alts_sleeve_daily.py
        continue-on-error: true

      - name: Sync alts_race con Pershing UGL (cost-basis weighted)
        run: python scripts/sync_alts_ugl.py
        continue-on-error: true

      - name: Brinson Attribution YTD
        run: python scripts/compute_attribution.py
        continue-on-error: true

      # (El download de NetX360 se movio mas arriba, antes de RECOMPUTE — ver nota ahi)
      - name: v2 — Transform (parsers + benchmark_comparison + holdings_returns + snapshot)
        run: python -m dashboard_v2.transform.run_all
        continue-on-error: true

      # === COMMIT + PUSH ===
      - name: Commit and push data/ if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes" && echo "committed=false" >> $GITHUB_OUTPUT && exit 0
          fi
          git commit -m "chore(daily): refresh BIG ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then echo "committed=true" >> $GITHUB_OUTPUT && exit 0; fi
            sleep 3
          done
          exit 1

      # === RECORD STATUS (siempre, ultimo paso antes del digest) ===
      - name: Record run status (alertas)
        if: always()
        run: python scripts/record_run_status.py --job-status "${{ job.status }}"

      - name: Commit alertas si hubo cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_alerts/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(alerts): run status $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done

      # === ALERTA INMEDIATA (todos los dias, si hubo alguna alerta hoy) ===
      # No usa `if: failure()` porque la mayoria de los steps de arriba tienen
      # continue-on-error: true -- el job puede terminar "success" aunque varios
      # hayan fallado en silencio. Este step manda mail el mismo dia que se
      # escribio CUALQUIER alerta en data/_alerts/ (cron_failure, sleeve anomaly,
      # health check, bench indices stale, netx360 download, etc.), sin esperar
      # a que alguien abra una sesion de Claude Code para verla.
      - name: Alerta inmediata por mail si hubo alertas hoy
        if: always()
        run: python scripts/send_failure_alert.py

      # === WEEKLY DIGEST (solo sabados) ===
      - name: Weekly digest mail (Saturdays only)
        if: steps.dow.outputs.is_saturday == 'true'
        run: python scripts/weekly_digest.py
