name: 🔄 Daily Refresh BIG (Lynk + Sleeves + Alertas + Digest)

# Routine unificada de actualizacion del dashboard de BIG.
# Corre los Lunes a Sabado a las 9:30 AM ART (= 12:30 UTC).
# CAMBIO 2026-08-18: antes corria 8 AM ART -- ese dia Lynk y Yahoo (AOR/ACWI/
# NASDAQ100/SP500) todavia no habian terminado de publicar el cierre T-1,
# dejando varios archivos pegados 1 dia atras hasta que alguien lo notaba y
# corria todo a mano de nuevo. Se corre mas tarde para dar mas margen.
# Reemplaza los workflows viejos:
#   - lynk-daily-refresh.yml
#   - equity-daily-refresh.yml
#
# Que hace:
#   1. Health-check (solo lunes): verifica que la corrida del sabado anterior haya
#      terminado OK. Si no, deja un warning marker.
#   2. Scrapea Lynk (NAV / YTD / SI / AUM / Vol / Sharpe) — KPIs principales.
#   3. Sync NAVs de equity UCITS desde Pershing/NetX360 (ex-baha, ver 2026-07-28).
#   4. Stooq prices (ETFs liquidos).
#   5. Yahoo bench indices (ACWI, AGG, SOFR para Normalized Performance).
#   6. Recompute Equity sleeve daily NAV + Equity Race (buy-and-hold vs ACWI).
#   7. Recompute FI sleeve daily NAV + FI Race (per-fondo T-1 con anclas baha).
#   8. Recompute Alts Race (liquidos: IBIT, GLD).
#   9. Brinson Attribution YTD.
#   10. Commit + push (data/) — los charts del dashboard se actualizan solos.
#   11. Record run status (success/failure marker en data/_alerts/).
#   12. Alerta inmediata por mail (todos los dias) si hubo alguna alerta hoy.
#   13. Weekly digest (solo sabados, ACTUALMENTE DESACTIVADO -- ver weekly_digest.py).
#
# Alertas:
#   - Si algo falla, queda marker en data/_alerts/cron_failure_YYYY-MM-DD.json
#     (y otros scripts dejan sus propios markers: sleeve_return_anomaly_*,
#     health_check_warning_*, bench_indices_stale_*, netx360_download_*, etc.)
#   - send_failure_alert.py manda mail SOLO A LUCAS el mismo dia si aparece
#     cualquiera de esos markers (2026-07-31, agregado porque Lucas se va de
#     vacaciones y varios steps tienen continue-on-error: true -- el job puede
#     terminar "success" aunque algo se haya roto en silencio).
#   - Ademas, Claude lo detecta al inicio de sesion (regla en MEMORY.md) y avisa.

on:
  schedule:
    # 12:30 UTC = 09:30 ART, Lunes a Sabado (1-6 en cron weekday).
    - cron: '30 12 * * 1-6'
  workflow_dispatch:
    inputs:
      force:
        description: "Correr aunque ya haya corrido hoy"
        type: boolean
        default: false

# Una sola corrida a la vez (2026-09-04). El guard compara contra
# last_run.json, que recien se escribe al FINAL: dos disparos simultaneos lo
# esquivan porque los dos leen el estado viejo. Paso hoy -- las corridas #92 y
# #93 arrancaron con 9 segundos de diferencia, corrieron en paralelo y al
# pushear una piso a la otra: #92 fallo en 'Commit and push data/'.
# Con esto la segunda espera a que termine la primera, y cuando le toca el
# guard ya ve last_run actualizado y la saltea sola.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Idempotencia (2026-08-31): desde que hay disparadores externos (tarea
  # local + cron-job.org) mas el schedule de GitHub, el workflow puede
  # recibir varios gatillos el mismo dia. Correrlo de nuevo no solo gasta
  # minutos: vuelve a entrar a NetX360 con Playwright y a pedir el OTP por
  # Gmail, que es la parte mas fragil de todo el pipeline. Este job decide
  # una vez si hace falta correr.
  guard:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.check.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: |
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "correr=si" >> $GITHUB_OUTPUT
            echo "force=true -- se corre igual."
          else
            R=$(python scripts/should_run_refresh.py)
            echo "correr=$R" >> $GITHUB_OUTPUT
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.correr == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LYNK_EMAIL: ${{ secrets.LYNK_EMAIL || 'lucas.monpelat@pampa-capital.com' }}
      BAHA_EMAIL: ${{ secrets.BAHA_EMAIL }}
      BAHA_PASSWORD: ${{ secrets.BAHA_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_LUCAS: ${{ secrets.MAIL_LUCAS }}
      # MAIL_FER se saco el 2026-09-10: TODO lo automatico va solo a Lucas.
      # El secret puede seguir existiendo en GitHub, ya no lo lee nadie.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # === Pipeline v2 (NetX360+ Pershing → canonical JSONs) ===
      NETX360_USER: ${{ secrets.NETX360_USER }}
      NETX360_PASSWORD: ${{ secrets.NETX360_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Detect day of week (set outputs)
        id: dow
        run: |
          DOW=$(date -u +%u)  # 1=Mon ... 6=Sat ... 7=Sun
          echo "dow=$DOW" >> $GITHUB_OUTPUT
          if [ "$DOW" = "1" ]; then echo "is_monday=true"   >> $GITHUB_OUTPUT; else echo "is_monday=false"   >> $GITHUB_OUTPUT; fi
          if [ "$DOW" = "6" ]; then echo "is_saturday=true" >> $GITHUB_OUTPUT; else echo "is_saturday=false" >> $GITHUB_OUTPUT; fi
          echo "Hoy es $(date -u +%A), dow=$DOW"

      # === HEALTH CHECK (solo lunes) ===
      - name: Health-check Saturday's run (Mondays only)
        if: steps.dow.outputs.is_monday == 'true'
        run: python scripts/check_previous_run.py --expected-day saturday
        continue-on-error: true

      # === SCRAPING ===
      # continue-on-error desde el 2026-09-15. ANTES este step no lo tenia, y el
      # dia que Lynk publico el NAV del lunes 14 en 0.000 su exit(1) se llevo
      # puestos los 23 pasos siguientes: no bajo el Pershing, no se armo
      # canonical/2026-09-15 y no hubo commit. Un dato malo del proveedor nos
      # costo el pipeline entero del dia.
      #
      # El dato nunca estuvo en riesgo: la guarda de validate_scrape() ya se
      # negaba a pisar lynk_data.json. Matar el job era proteccion redundante.
      # Ahora el script deja la alerta en data/_alerts/ y el step "Alerta
      # inmediata por mail" (linea ~343) la manda el mismo dia. Mismo aviso,
      # sin arrastrar al resto.
      #
      # El `if` del final NO es paranoia: es el agujero que abre el
      # continue-on-error. El script deja alerta cuando el DATO es invalido,
      # pero si se muere por otra cosa (timeout de Playwright, cambio de layout
      # que tira excepcion, red) no alcanza a escribir nada -- y sin el job rojo
      # eso quedaria verde y mudo hasta que alguien mire a mano. El freshness
      # check que vigila lynk_data.json no corre en ningun cron.
      - name: Lynk NAV scrape (KPIs)
        continue-on-error: true
        run: |
          A="data/_alerts/lynk_scrape_invalido_$(date -u +%Y-%m-%d).json"
          rc=0
          python scripts/lynk_refresher.py --email "$LYNK_EMAIL" --alerta "$A" || rc=$?
          if [ "$rc" -ne 0 ] && [ ! -f "$A" ]; then
            mkdir -p data/_alerts
            python scripts/write_crash_alert.py --path "$A" \
              --tipo lynk_scrape_crash --rc "$rc" \
              --que "el scrape de KPIs de Lynk (lynk_refresher.py)" \
              --archivo data/lynk_data.json
          fi

      # Este escribe la serie historica completa del NAV (retornos, vol, grafico).
      # Hasta el 2026-09-15 no validaba NADA: pisaba el archivo con lo que viniera.
      # El 0 del 14-Sep no entro solo porque el step de arriba mato el job antes
      # de que este corriera. Ahora tiene guarda propia (ver validar_serie()).
      - name: Lynk NAV series (full history)
        continue-on-error: true
        run: |
          A="data/_alerts/lynk_serie_nav_invalida_$(date -u +%Y-%m-%d).json"
          rc=0
          python scripts/lynk_nav_extractor.py --email "$LYNK_EMAIL" --alerta "$A" || rc=$?
          if [ "$rc" -ne 0 ] && [ ! -f "$A" ]; then
            mkdir -p data/_alerts
            python scripts/write_crash_alert.py --path "$A" \
              --tipo lynk_serie_crash --rc "$rc" \
              --que "el extractor de la serie de NAV (lynk_nav_extractor.py)" \
              --archivo data/lynk_nav_series.json
          fi

      - name: Sync UCITS NAV desde Pershing/NetX360 (reemplaza baha, ver 2026-07-28)
        run: python scripts/sync_ucits_nav_from_pershing.py
        continue-on-error: true

      - name: Stooq prices (ETFs liquidos)
        run: python scripts/price_refresher.py
        continue-on-error: true

      # --sin-alerta a proposito: a esta hora (09:30 ART) Yahoo devuelve seguido
      # una respuesta sin el ultimo cierre, y un rato despues se acomoda sola.
      # Paso el 18-Ago, 29-Ago, 31-Ago y 23-Sep -- las cuatro veces hubo que
      # correrlo a mano. El dato queda protegido igual (se preserva la ultima
      # serie buena); quien alarma es bench-indices-tarde.yml, que vuelve a
      # intentar a las 17 UTC y para entonces ya es un problema de verdad.
      - name: Bench indices Equity (ACWI / S&P / Nasdaq / MSCI World)
        run: python scripts/bench_indices_refresher.py --sin-alerta
        continue-on-error: true

      - name: Bench indices FI (AGG / SOFR / UST)
        run: python scripts/fi_bench_indices_refresher.py
        continue-on-error: true

      - name: Bench 60/40 (AOR ETF)
        run: python scripts/bmk_refresher.py
        continue-on-error: true

      # === PIPELINE V2 (NetX360+ Pershing → canonical JSONs) ===
      # Movido mas temprano (antes: despues de Brinson Attribution) para que
      # compute_holdings_returns.py y refresh_holdings_returns_daily.py usen
      # el mismo download del dia (qty/cost basis 100% al dia, ver nota abajo).
      - name: v2 — NetX360+ Pershing download (4 XLSX)
        run: python dashboard_v2/ingest/netx360_auto.py
        continue-on-error: true

      # Fix 2026-08-28: el canonical del dia se generaba recien al final del
      # workflow, pero sync_positions_latest_from_canonical corre mucho antes y
      # toma "el snapshot mas reciente" -- o sea el de AYER. En un dia normal no
      # se nota; en un dia con TRADES, positions_latest queda con las qty
      # PRE-trade mientras los flujos ya cuentan la compra, y refresh_equity_daily
      # calcula un MV corto -> salto falso del indice.
      # Paso el 2026-08-27 (venta LGLI + compra MAGS/THOR): el sleeve Equity
      # mostro -10.19% en un dia y el YTD paso de +8.12% a -2.89%.
      # Se parsea el snapshot de HOY aca. El transform del final se mantiene:
      # reconstruye benchmark_comparison y holdings_returns con las series de
      # sleeve ya recalculadas.
      - name: v2 — Transform temprano (canonical del dia, ANTES del sync)
        run: python -m dashboard_v2.transform.run_all
        continue-on-error: true

      # Reconstruye qty/cost_basis/buys_history desde el UGL+RGL+Transactions
      # de HOY (merge incremental -- ver docstring de merge_buys_history en el
      # script, seguro para correr todos los dias sin perder historial viejo).
      # Fix 2026-07-28: sin este paso, holdings_returns_{sleeve}.json solo se
      # actualizaba corriendo el script a mano, y quedaba con qty vieja
      # (ej: IBIT/GLD/PIMCO-LD/MANIG/SGCB con compras recientes sin capturar).
      - name: Reconcile qty/cost basis con Pershing (compute_holdings_returns, merge-safe)
        run: |
          RAW_DIR="data/raw/$(date -u +%Y-%m-%d)/netx360"
          if [ -f "$RAW_DIR/Unrealized+Gain+Loss_JXD101380.xlsx" ]; then
            python scripts/compute_holdings_returns.py \
              --ugl "$RAW_DIR/Unrealized+Gain+Loss_JXD101380.xlsx" \
              --rgl "$RAW_DIR/Realized+Gain+Loss_JXD101380.xlsx" \
              --tx  "$RAW_DIR/Transactions_JXD101380.xlsx"
          else
            echo "No se descargaron los XLSX de NetX360 hoy -- se omite (holdings_returns_*.json queda con la ultima qty conocida)."
          fi
        continue-on-error: true

      # Sync qty/price/value en positions_latest.json desde el canonical fresco.
      # Fix 2026-07-28: este archivo legacy alimenta el "override" del ultimo
      # punto en refresh_equity_daily.py / refresh_fi_daily.py / refresh_alts_daily.py
      # -- quedo congelado en 2026-06-24 (nadie lo subia a mano), causando que
      # equity_sleeve_real.json / fi_sleeve_real.json (que alimentan el "Sleeve
      # SI/YTD" del dashboard) usaran qty vieja para PIMCO-LD/MANIG/SGCB, y ni
      # siquiera incluyeran MAGS/HEWJ (compras del 2026-07-02).
      - name: Sync positions_latest.json desde canonical (Pershing)
        run: python scripts/sync_positions_latest_from_canonical.py
        continue-on-error: true

      # === RECOMPUTE ===
      - name: Recalc Equity sleeve daily NAV
        run: python scripts/refresh_equity_daily.py

      - name: Recalc Equity race daily (buy-and-hold vs ACWI)
        run: python scripts/refresh_equity_race_daily.py
        continue-on-error: true

      - name: Recalc FI sleeve daily NAV
        run: python scripts/refresh_fi_daily.py

      - name: Recalc FI race daily (per-fondo T-1 anclas baha)
        run: python scripts/refresh_fi_race_daily.py
        continue-on-error: true

      - name: Recalc Alts race daily (liquidos)
        run: python scripts/refresh_alts_daily.py
        continue-on-error: true

      - name: Refresh holdings returns T-1 (cost basis methodology)
        run: python scripts/refresh_holdings_returns_daily.py
        continue-on-error: true

      # Extiende el TWR real de Alts (data/alts_sleeve_real.json, reconstruccion
      # completa 2026-07-31 desde statements Pershing + Carlyle) con el punto de
      # hoy, y propaga sleeve_index/sleeve_monthly_returns a alts_race.json --
      # ese archivo ya NO se reconstruye con proxies en cada corrida (alts_race.py
      # no esta en el cron), asi que sin este paso quedaria congelado.
      # Debe correr ANTES de sync_alts_ugl.py (que calcula stats 1M/3M/6M/YTD/SI
      # leyendo sleeve_index).
      - name: Extender Alts sleeve TWR real (jun-30 anchor Pershing+Carlyle)
        run: python scripts/refresh_alts_sleeve_daily.py
        continue-on-error: true

      - name: Sync alts_race con Pershing UGL (cost-basis weighted)
        run: python scripts/sync_alts_ugl.py
        continue-on-error: true

      # Chequeo de integridad del TWR de Equity/FI/Alts (anchor drift, saltos
      # de indice implausibles, transacciones pendientes duplicadas). Fix
      # 2026-07-30: un bug de anchor Modified Dietz dio un FI YTD -1.09%
      # ficticio durante dias sin que nadie lo notara (Fer lo vio antes que
      # Lucas). Fix 2026-08-10: se saco el cross-check contra el YTD cost-basis
      # (Lucas: son 2 metodologias distintas a proposito, divergen solas cuando
      # entra plata nueva -- prefiere chequeos directos sobre el UNICO numero
      # oficial en vez de compararlo contra otro que mide algo distinto). Este
      # paso escribe una alerta en data/_alerts/ si algo similar vuelve a pasar,
      # para que se detecte ANTES de llegar a produccion sin avisar. Ver
      # memoria bug_twr_anchor_gap_modified_dietz. Corre DESPUES de extender
      # Alts para chequear los 3 sleeves con su dato mas fresco.
      - name: Validar integridad TWR Equity/FI/Alts (anchor drift, saltos, duplicados)
        run: python scripts/validate_sleeve_returns.py
        continue-on-error: true

      - name: Brinson Attribution YTD
        run: python scripts/compute_attribution.py
        continue-on-error: true

      # (El download de NetX360 se movio mas arriba, antes de RECOMPUTE — ver nota ahi)
      - name: v2 — Transform (parsers + benchmark_comparison + holdings_returns + snapshot)
        run: python -m dashboard_v2.transform.run_all
        continue-on-error: true

      # === COMMIT + PUSH ===
      # Pershing re-marca los privados sin avisar y sin periodicidad fija. Esto
      # compara el snapshot de hoy contra el anterior y deja alerta si alguno se
      # movio. Va ANTES del commit para que la alerta viaje en el mismo push.
      #
      # No mira IBIT ni GLD (ETF liquidos: avisarian todos los dias) ni CALP (no
      # viene de Pershing). Y no se guia por price_date: BPCC lo avanza casi a
      # diario con el precio quieto. Ver el script.
      - name: ¿Pershing re-marcó algún alternativo ilíquido?
        continue-on-error: true
        run: |
          python scripts/check_alts_nav_updates.py             --alerta "data/_alerts/alts_nav_remarcado_$(date -u +%Y-%m-%d).json"

      # Las fichas de fondos (data/funds/*.json) son la unica fuente de yield,
      # paises y metricas por fondo desde el 2026-09-18. El tab Geography lee el
      # indice que sale de ellas. Las fichas no cambian a diario (se editan cuando
      # llega un factsheet), asi que esto es una red: si alguien edita una ficha
      # y se olvida de regenerar el indice, el tab no se queda con el dato viejo.
      # El validador ademas lo marca como error antes del deploy.
      - name: Fichas de fondos -> indice del tab Geography
        continue-on-error: true
        run: |
          A="data/_alerts/funds_index_$(date -u +%Y-%m-%d).json"
          rc=0
          python scripts/build_funds_index.py || rc=$?
          if [ "$rc" -ne 0 ]; then
            python scripts/write_crash_alert.py --path "$A" \
              --tipo funds_index_crash --rc "$rc" \
              --que "el armado del indice de fichas (build_funds_index.py)" \
              --archivo data/funds_index.json
          fi

      # Top 10 consolidado del sleeve Equity (look-through de los factsheets por
      # el peso de cada fondo). Era MANUAL, y por eso se fosilizo: LGLI se vendio
      # el 24-Ago-2026 y el archivo -- generado el 25-Ago, con Pershing todavia
      # mostrandolo abierto -- lo siguio contando con 5.86% del sleeve durante un
      # mes, diluyendo a todos los demas. El script ya filtraba las posiciones
      # cerradas; lo que faltaba era que corriera.
      #
      # Los pesos del sleeve cambian todos los dias, asi que va en el cron diario.
      - name: Top 10 consolidado del sleeve Equity
        continue-on-error: true
        run: |
          A="data/_alerts/equity_lookthrough_$(date -u +%Y-%m-%d).json"
          rc=0
          python scripts/build_equity_lookthrough.py || rc=$?
          if [ "$rc" -ne 0 ]; then
            python scripts/write_crash_alert.py --path "$A" \
              --tipo equity_lookthrough_crash --rc "$rc" \
              --que "el look-through del sleeve Equity (build_equity_lookthrough.py)" \
              --archivo data/equity_top10_consolidated.json
          fi

      # Overlap del sleeve Equity contra el top 10 de ACWI. Mismo caso que el
      # look-through: era manual y quedo del 25-Ago, contando a LGLI (vendido el
      # 24-Ago) con 5.86% del sleeve. Eso diluia a todos los demas y hacia ver la
      # exposicion al top 10 de ACWI en 14.93% cuando es 18.05%.
      #
      # OJO: el lado ACWI sale de data/acwi_holdings/acwi_holdings.csv, que se
      # baja A MANO y hoy es de Abril-2026. El archivo declara esa fecha en su
      # campo `source`, asi que la vejez queda a la vista; refrescar el CSV es
      # aparte.
      - name: Overlap Equity vs top 10 de ACWI
        continue-on-error: true
        run: |
          A="data/_alerts/acwi_overlap_$(date -u +%Y-%m-%d).json"
          rc=0
          python scripts/acwi_overlap.py || rc=$?
          if [ "$rc" -ne 0 ]; then
            python scripts/write_crash_alert.py --path "$A" \
              --tipo acwi_overlap_crash --rc "$rc" \
              --que "el overlap contra ACWI (acwi_overlap.py)" \
              --archivo data/acwi_overlap.json
          fi

      - name: Commit and push data/ if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes" && echo "committed=false" >> $GITHUB_OUTPUT && exit 0
          fi
          git commit -m "chore(daily): refresh BIG ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then echo "committed=true" >> $GITHUB_OUTPUT && exit 0; fi
            sleep 3
          done
          exit 1

      # === RECORD STATUS (siempre, ultimo paso antes del digest) ===
      - name: Record run status (alertas)
        if: always()
        run: python scripts/record_run_status.py --job-status "${{ job.status }}"

      - name: Commit alertas si hubo cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_alerts/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(alerts): run status $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done

      # === ALERTA INMEDIATA (todos los dias, si hubo alguna alerta hoy) ===
      # No usa `if: failure()` porque la mayoria de los steps de arriba tienen
      # continue-on-error: true -- el job puede terminar "success" aunque varios
      # hayan fallado en silencio. Este step manda mail el mismo dia que se
      # escribio CUALQUIER alerta en data/_alerts/ (cron_failure, sleeve anomaly,
      # health check, bench indices stale, netx360 download, etc.), sin esperar
      # a que alguien abra una sesion de Claude Code para verla.
      - name: Alerta inmediata por mail si hubo alertas hoy
        if: always()
        run: python scripts/send_failure_alert.py

      # === WEEKLY DIGEST (solo sabados) ===
      - name: Weekly digest mail (Saturdays only)
        if: steps.dow.outputs.is_saturday == 'true'
        run: python scripts/weekly_digest.py
